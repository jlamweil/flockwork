[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flockwork"
version = "0.3.0"
description = "A worker swarm whose entire coordination substrate is git itself."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "J Lam" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.scripts]
flockwork = "l2.inrepo:main"

[project.urls]
Homepage = "https://github.com/jlamweil/flockwork"
Repository = "https://github.com/jlamweil/flockwork"
"Bug Tracker" = "https://github.com/jlamweil/flockwork/issues"

[tool.setuptools]
packages = ["l2"]
